# Shared fixtures for the negative-fixture regression suite.
#
# Each tests/fixtures/broken/*.typ starts from the same minimal skeleton
# (baseline.typ) and introduces exactly one defect. This TOML describes
# what a *clean* compile of that skeleton should extract to, so the
# broken variants can fail specific assertions cleanly.

[candidate]
name = "Jane Doe"
email = "jane@example.com"

[sections]
expected_order = [
    "Work Experience",
    "Projects",
    "Skills",
    "Education",
]

[[jobs]]
title = "Staff Engineer"
company = "Acme Corp"
date_start = "Jan 2022"
date_end = "Present"

[[jobs]]
title = "Senior Engineer"
company = "Globex"
date_start = "Jun 2019"
date_end = "Dec 2021"

[dates]
allowed_range_regex = '(Jan(uary)?|Feb(ruary)?|Mar(ch)?|Apr(il)?|May|Jun(e)?|Jul(y)?|Aug(ust)?|Sep(tember)?|Oct(ober)?|Nov(ember)?|Dec(ember)?)\s+\d{4}\s*[–\-]\s*(Present|(Jan(uary)?|Feb(ruary)?|Mar(ch)?|Apr(il)?|May|Jun(e)?|Jul(y)?|Aug(ust)?|Sep(tember)?|Oct(ober)?|Nov(ember)?|Dec(ember)?)\s+\d{4})'

[thresholds]
min_bytes = 300
job_block_window_chars = 300
name_head_bytes = 400
contact_glue_window = 200

[keywords]
# Technical terms that must survive extraction as exact substrings in every
# extractor. Guards against ligature collapse / font substitution dropping
# ATS-searchable keywords. Derived from the baseline fixture's Skills line.
required = ["Python", "Go", "Rust", "Java"]

[mojibake]
forbidden_chars = ["\uFFFD"]
flagged_chars = ["\u2018", "\u2019", "\u201C", "\u201D", "\u2014"]
allowed_chars = ["\u2013"]
