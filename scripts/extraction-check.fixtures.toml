[dates]
allowed_range_regex = '(Jan(uary)?|Feb(ruary)?|Mar(ch)?|Apr(il)?|May|Jun(e)?|Jul(y)?|Aug(ust)?|Sep(tember)?|Oct(ober)?|Nov(ember)?|Dec(ember)?)\s+\d{4}\s*[–\-]\s*(Present|(Jan(uary)?|Feb(ruary)?|Mar(ch)?|Apr(il)?|May|Jun(e)?|Jul(y)?|Aug(ust)?|Sep(tember)?|Oct(ober)?|Nov(ember)?|Dec(ember)?)\s+\d{4})'

[thresholds]
min_bytes = 500
job_block_window_chars = 300
name_head_bytes = 400
contact_glue_window = 200

[keywords]
# Technical terms that must survive every local extractor as exact substrings.
# Guards against ligature collapse and font-substitution regressions. Derived
# from the JSON Skills section; keep in sync when skills change.
required = [
    "Java",
    "Rust",
    "Python",
    "TypeScript",
    "Kafka",
    "gRPC",
    "Temporal",
    "Flink",
    "Spark",
    "Kubernetes",
    "MySQL",
    "Redis",
    "Couchbase",
]

[mojibake]
forbidden_chars = ["\uFFFD"]
# The Golden renderer uses an em dash between an organization/project and role.
flagged_chars = ["\u2018", "\u2019", "\u201C", "\u201D", "\u2014"]
allowed_chars = ["\u2013", "\u2014"]
